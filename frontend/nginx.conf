# Derive download names from the published release without changing update URLs.
map $realpath_root $latest_apk_filename {
    default filfit.apk;
    "~/android/releases/(?<latest_apk_build>[1-9][0-9]*)-[a-f0-9]{64}$" "filfit_build${latest_apk_build}.apk";
}
map $uri $apk_download_filename {
    default $latest_apk_filename;
    "~^/android/releases/(?<immutable_apk_build>[1-9][0-9]*)-[a-f0-9]{64}/FilFit\\.apk$" "filfit_build${immutable_apk_build}.apk";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fixed aliases follow one atomic current release symlink.
    location = /android/latest.apk {
        root /usr/share/nginx/html/android/current;
        rewrite ^ /FilFit.apk break;
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$apk_download_filename"';
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        types {}
    }
    location = /android/latest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location ^~ /android/ {
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$apk_download_filename"';
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache release pointers (Telegram WebView/PWA refresh).
    location ~ ^/(index\.html|manifest\.webmanifest|version\.json|sw\.js|sw\.js\.map)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Long-cache hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Approved illustration filenames include the source fingerprint.
    location ~ "^/(exercise-images|exercise-thumbnails)/[0-9]{3}-[0-9]{4}-[a-f0-9]{12}(-start)?\.webp$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
