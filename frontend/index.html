<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fitness Mini App</title>
    <script>
      (() => {
        const recoveryKey = "fitness:boot-recovery";
        const recover = (force = false) => {
          if (window.__FITNESS_APP_BOOTED__ && !force) return;
          const now = Date.now();
          const previous = Number(sessionStorage.getItem(recoveryKey) || 0);
          if (now - previous < 15000) return;
          sessionStorage.setItem(recoveryKey, String(now));
          navigator.serviceWorker?.getRegistration()
            .then((registration) => registration?.update())
            .catch(() => undefined);
          const target = new URL(window.location.href);
          target.searchParams.set("__app_refresh", String(now));
          window.location.replace(target.href);
        };
        window.addEventListener("error", (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement || target instanceof HTMLLinkElement) {
            const resource = target instanceof HTMLScriptElement ? target.src : target.href;
            if (resource) {
              const url = new URL(resource, window.location.href);
              if (url.origin === window.location.origin && url.pathname.startsWith("/assets/")) {
                recover(true);
              }
            }
          }
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
          const message = String(event.reason?.message || event.reason || "");
          if (/chunk|module|import|fetch/i.test(message)) recover(true);
        });
        window.setTimeout(recover, 12000);
      })();
    </script>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="bg-tg-bg text-tg-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
