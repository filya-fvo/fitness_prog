name: fitness

# VPS production stack.
#
# First start:
#   cp backend/.env.production.example backend/.env.production
#   # Fill every CHANGE_ME / REPLACE_* value, APP_DOMAIN and API_DOMAIN.
#   docker compose --env-file backend/.env.production config --quiet
#   docker compose --env-file backend/.env.production up -d --build
#   docker compose --env-file backend/.env.production run --rm api \
#     python scripts/seed_prod_content.py
#   docker compose --env-file backend/.env.production run --rm api \
#     python scripts/seed_nutrition.py

services:
  db:
    # The SQL schema requires CREATE EXTENSION vector; plain postgres is insufficient.
    # Keep PostgreSQL at the same major version as the current Windows install,
    # so a pg_dump/pg_restore cutover never attempts a major-version downgrade.
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env.production}
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
    volumes:
      # PostgreSQL 18 stores PGDATA in /var/lib/postgresql/18/docker and declares
      # /var/lib/postgresql as its volume. The legacy /data target is unsafe here.
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-fitness}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env.production}
      PGDATABASE: ${POSTGRES_DB:-fitness}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./scripts/apply_migrations_vps.sh:/apply-migrations.sh:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /bin/sh /apply-migrations.sh

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env.production}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_DIR: /app/logs
      ADMIN_SYSTEM_STATUS_DIR: /app/host-status
      LLM_PROVIDER: local
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL: qwen2.5-3b-instruct
      OCR_BASE_URL: http://ocr:8090
      TELEGRAM_UPDATE_MODE: polling
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - /opt/fitness/status:/app/host-status:ro
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - ai_internal
      - ipv6_egress

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:db8e923e6edc9241ad788979af79543a1e1ba55dbb7d41e62490ef0d0ad3c8e7
    restart: unless-stopped
    command:
      - --model
      - /models/qwen2.5-3b-instruct-q4_k_m.gguf
      - --alias
      - qwen2.5-3b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "1"
      - --threads
      - "2"
      - --no-warmup
    volumes:
      - ${LOCAL_AI_MODELS_DIR:-./models}:/models:ro
    expose:
      - "8080"
    mem_limit: 2800m
    cpus: 2.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    networks:
      - ai_internal

  ocr:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.ocr_main:app", "--host", "0.0.0.0", "--port", "8090"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "8090"
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    networks:
      - ai_internal

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["arq", "app.tasks.notifications.WorkerSettings"]
    # The backend image checks its HTTP port by default. ARQ has no HTTP server,
    # so its liveness is confirmed from startup/task logs instead.
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env.production}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_DIR: /app/logs
      TELEGRAM_UPDATE_MODE: polling
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - ai_internal
      - ipv6_egress

  telegram-poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.telegram_poller"]
    # The poller has no HTTP server; liveness is reported through Redis heartbeat.
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_DIR: /app/logs
      TELEGRAM_UPDATE_MODE: polling
    volumes:
      - backend_logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - ipv6_egress

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in backend/.env.production}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
    restart: unless-stopped
    volumes:
      # Previous hashed chunks survive container replacement for open Telegram/PWA clients.
      - frontend_releases:/usr/share/nginx/html
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in backend/.env.production}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in backend/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in backend/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  backend_logs:
  backend_data:
  frontend_releases:
  caddy_data:
  caddy_config:

networks:
  ai_internal:
    internal: true
  # Timeweb currently cannot reach Telegram Bot API over IPv4. Keep dual-stack
  # outbound traffic isolated to the two services that call external APIs.
  ipv6_egress:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:9b7a:6d31:2::/64
