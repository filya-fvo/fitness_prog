name: Public health monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://viacheslav-msk.tail7c8a5a.ts.net/health' }}
    steps:
      - name: Probe public application
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$PUBLIC_HEALTH_URL")"
          python -c 'import json,sys; data=json.loads(sys.argv[1]); assert data.get("status") == "ok", data' "$response"
          echo "Public health endpoint is available."
