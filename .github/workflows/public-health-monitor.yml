name: Public health monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://viacheslav-msk.tail7c8a5a.ts.net/health' }}
    steps:
      - name: Probe public application
        shell: bash
        run: |
          set -euo pipefail
          case "$PUBLIC_HEALTH_URL" in
            https://*) ;;
            *) echo "::error::PUBLIC_HEALTH_URL must use HTTPS"; exit 2 ;;
          esac

          last_status=1
          for attempt in $(seq 1 6); do
            echo "Public health attempt ${attempt}/6"
            if response="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "$PUBLIC_HEALTH_URL")"; then
              if python -c 'import json,sys; data=json.loads(sys.argv[1]); assert data.get("status") == "ok", data' "$response"; then
                echo "Public health endpoint is available."
                exit 0
              else
                last_status=$?
              fi
            else
              last_status=$?
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "::warning::Public endpoint is temporarily unavailable; retrying in 15 seconds"
              sleep 15
            fi
          done

          echo "::error::Public health endpoint remained unavailable after 6 attempts"
          exit "$last_status"
