name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run pytest
        env:
          BOT_TOKEN: "ci-test-bot-token"
          JWT_SECRET: "ci-test-jwt-secret-not-for-production"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/fitness"
          CORS_ORIGINS: "https://web.telegram.org"
          ENVIRONMENT: "test"
        run: pytest -q
      - name: Compile app import
        env:
          BOT_TOKEN: "ci-test-bot-token"
          JWT_SECRET: "ci-test-jwt-secret-not-for-production"
        run: python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          VITE_API_URL: https://api.example.com
          VITE_BOT_USERNAME: fil_fit_bot
        run: npm run build

  docker-api:
    name: Docker API image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t fitness-api:ci ./backend
