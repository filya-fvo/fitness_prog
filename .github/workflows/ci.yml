name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run pytest
        env:
          BOT_TOKEN: "ci-test-bot-token"
          JWT_SECRET: "ci-test-jwt-secret-not-for-production"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/fitness"
          CORS_ORIGINS: "https://web.telegram.org"
          ENVIRONMENT: "test"
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Compile app import
        env:
          BOT_TOKEN: "ci-test-bot-token"
          JWT_SECRET: "ci-test-jwt-secret-not-for-production"
        run: python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: https://api.example.com
          VITE_BOT_USERNAME: fil_fit_bot
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle

  frontend-e2e:
    name: Frontend (browser QA)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-failure
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Build for Lighthouse
        env:
          VITE_API_URL: https://api.example.com
          VITE_BOT_USERNAME: fil_fit_bot
        run: npm run build
      - name: Lighthouse
        run: |
          echo "CHROME_PATH=$(node -e \"const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())\")" >> "$GITHUB_ENV"
          npm run audit:lighthouse

  frontend-visual:
    name: Frontend (visual QA)
    runs-on: windows-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Visual regression tests
        env:
          PLAYWRIGHT_VISUAL_QA: "1"
        run: npm run test:e2e -- --grep "@visual"
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-qa-failure
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker-api:
    name: Docker API image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t fitness-api:ci ./backend
