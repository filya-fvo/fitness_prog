# Render Blueprint (optional). Connect repo and adjust service names/domains.
# Free web services sleep on inactivity — for always-on use paid or Railway/VPS.

services:
  - type: web
    name: fitness-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.6-27b
      - key: LLM_FALLBACK_MODELS
        value: ""
      - key: NUTRITION_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: AI_DAILY_LIMIT
        value: 10

  - type: worker
    name: fitness-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: arq app.tasks.notifications.WorkerSettings
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromService:
          name: fitness-api
          type: web
          envVarKey: DATABASE_URL
      - key: BOT_TOKEN
        fromService:
          name: fitness-api
          type: web
          envVarKey: BOT_TOKEN
      - key: REDIS_URL
        fromService:
          name: fitness-api
          type: web
          envVarKey: REDIS_URL
      - key: JWT_SECRET
        fromService:
          name: fitness-api
          type: web
          envVarKey: JWT_SECRET
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        fromService:
          name: fitness-api
          type: web
          envVarKey: WEB_PUSH_VAPID_PUBLIC_KEY
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        fromService:
          name: fitness-api
          type: web
          envVarKey: WEB_PUSH_VAPID_PRIVATE_KEY
      - key: WEB_PUSH_VAPID_SUBJECT
        fromService:
          name: fitness-api
          type: web
          envVarKey: WEB_PUSH_VAPID_SUBJECT
